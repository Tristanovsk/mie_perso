[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mie_perso"
dynamic = ["version"]
description = "simple code calling PyMieScatt for multiprocessor computation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "T. Harmel", email = "tristan.harmel@gmail.com" }]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "dask",
    "lmfit",
    "matplotlib",
    "PyMieScatt",
]

[tool.setuptools.dynamic]
version = { attr = "mie_perso.__version__" }

[tool.setuptools.packages.find]
include = ["mie_perso*"]

[tool.setuptools.package-data]
"*" = ["*.nc", "*.txt", "*.csv", "*.dat"]
